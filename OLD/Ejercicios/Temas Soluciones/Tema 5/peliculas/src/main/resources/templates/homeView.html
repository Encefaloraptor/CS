<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elige tu película favorita</title>
  <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <style>
    td {
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <h3>Elige tu película favorita</h3>
  <form action="#" method="post" th:action="@{/}" th:object="${formInfo}">
    <table>
      <tr>
        <td>
          <img src="images/avatar.jpg" alt="Avatar" style="width:200px;">
        </td>
        <td>
          <img src="images/cadenaPerpetua.jpg" alt="Cadena Perpetua" style="width:200px;">
        </td>
        <td>
          <img src="images/pulpFiction.jpg" alt="Pulp Fiction" style="width:200px;">
        </td>
      </tr>
      <tr>
        <td th:each="voto :${votosFoto}">
          <i class="bi bi-heart"></i>
          <span th:text="${voto}">*</span>
        </td>
      </tr>
      <tr>
        <td>
          <div>Voto: <input type="radio" value="0" name="voto" th:field="*{voto}"></input></div>
        </td>
        <td>
          <div>Voto: <input type="radio" value="1" name="voto" th:field="*{voto}"></input></div>
        </td>
        <td>
          <div>Voto: <input type="radio" value="2" name="voto" th:field="*{voto}"></input></div>
        </td>
      </tr>
      <tr>
        <td>
          Su email:
        </td>
        <td colspan="2">
          <input type="email" name="email" id="email" th:field="*{email}" style="width: -webkit-fill-available;">
        </td>
      </tr>
      <tr>
        <td colspan="3">
          <input type="submit" value="Votar" style="width: -webkit-fill-available;"/>
        </td>
      </tr>
    </table>

  </form>

  <p class="alert alert-danger" th:if="${txtErr.isPresent()}"><span th:text="${txtErr.get()}"></span></p>
</body>

</html>
