<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <title>Formulario</title>
</head>

<body>

   <form action="#" method="post" th:action="@{/myForm/submit}" th:object="${formInfo}">
   <div th:if="${txtErr != null}">
       <p class="alert alert-danger" th:text="${txtErr}"></p>
   </div>

   <div th:classappend="${#fields.hasErrors('fecha1')} ? cssError">
      <label>Fecha 1:   <input type="date" id="fecha1" th:field="*{fecha1}"></label>
      <span th:if="${#fields.hasErrors('fecha1')}" th:errors="*{fecha1}" ></span>
   </div>

   <div th:classappend="${#fields.hasErrors('fecha2')} ? cssError">
      <label>Fecha 2:  <input type="date" id="fecha2" th:field="*{fecha2}"></label>
      <span th:if="${#fields.hasErrors('fecha2')}" th:errors="*{fecha2}"></span>
   </div>

      <input type="submit" name="submitButton" value="diferencia" />
      <input type="submit" name="submitButton" value="bisiestos" />
      <input type="submit" name="submitButton" value="domingo" />
   </form>
</body>

</html>
