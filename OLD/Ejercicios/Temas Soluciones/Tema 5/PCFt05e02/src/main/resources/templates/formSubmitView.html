<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario procesado</h1>
    <p><strong>Fecha 1:</strong> <span th:text="${formInfo.fecha1}"></span></p>
    <p><strong>Fecha 2:</strong> <span th:text="${formInfo.fecha2}"></span></p>

    <hr/>

    <p th:text="${resultado}"></p>

    <hr/>

    <form th:action="@{/myForm}" method="get">
        <button type="submit">Volver al formulario</button>
    </form>
    <p></p>
</body>
</html>
