<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <p>Introduce dos numero para ver la suma</p>
    <form action="#" method="post" th:action="@{/resultado}" th:object="${formInfo}">
        <label>Número 1: <input type="text" id="num1" th:field="*{num1}"></label>
        <label>Número 2: <input type="text" id="num2" th:field="*{num2}"></label>
        <input type="submit" value="enviar">
    </form>
</body>
</html>
