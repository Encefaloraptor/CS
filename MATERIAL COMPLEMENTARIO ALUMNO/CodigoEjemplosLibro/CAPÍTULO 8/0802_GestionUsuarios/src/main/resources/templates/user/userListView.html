<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head> 
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp</title>
  </head>
<body>
      <h1>Usuarios</h1>
      <table border="1">
        <thead><tr>
          <tr><th>Id</th><th>Nombre</th><th>Rol</th>
            <th>Editar</th><th>Borrar</th></tr>
          </tr>
        </thead>
        <tbody>
          <tr th:each="usuario : ${listaUsuarios}">
            <td th:text="${usuario.id}">Id</td>
            <td th:text="${usuario.nombre}">Nombre</td>
            <td th:text="${usuario.rol}">Rol</td>
            <td><a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a></td>        		
            <td><a th:href="@{/usuarios/borrar/{id}(id=${usuario.id})}">Borrar</a></td> 
          </tr>
        </tbody>
      </table>
      <a th:href="@{/usuarios/nuevo}">Nuevo usuario</a><br/>
      <a th:href="@{/}">Inicio</a><br/>
    </body>
</html>
