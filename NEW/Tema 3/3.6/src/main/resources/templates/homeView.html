<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elige tu película favorita</title>
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <style>
      td {
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <h3>Elige tu poison</h3>
    <table>
      <tr>
        <td>
          <a th:href="@{/voto?foto=0}"
            ><img
              src="images/Bloom.jpg"
              alt="Bloom into you"
              style="width: 200px"
          /></a>
        </td>
        <td>
          <a th:href="@{/voto?foto=1}"
            ><img
              src="images/Silent.jpg"
              alt="Secrets of a silent witch"
              style="width: 200px"
          /></a>
        </td>
        <td>
          <a th:href="@{/voto?foto=2}"
            ><img src="images/Watanare.jpg" alt="Watanare" style="width: 200px"
          /></a>
        </td>

        <!-- suponiendo que las fotos fuesen dinámicas y llegasen del servidor -->
        <!-- <td th:each="img, iter : ${fotos}">
      <a th:href="@{'/voto?foto='+${iter.index}}">
        <img th:src="${'images/'+img}" style="width:200px;"></a>
    </td> -->
    
      </tr>
      <tr>
        <td th:each="voto :${votosFoto}">
          <i class="bi bi-heart"></i>
          <span th:text="${voto}">*</span>
        </td>
      </tr>
    </table>

    <p class="alert alert-danger" th:if="${txtErr!=null}">Voto invalido</p>
  </body>
</html>
