<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cálculos</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div th:insert="~{fragments/navBar :: navBar}"></div>

    <main>
      <div>
        <h3>Cálculos de hipotenusa</h3>

        Cateto 1: <input type="text" id="cateto1" /> Cateto 2:
        <input type="text" id="cateto2" />

        <button onclick="calcularHipotenusa()">Calcular</button>
      </div>

      <div>
        <h3>Cálculos de números primos</h3>

        Número: <input type="text" id="numeroPrimo" />

        <button onclick="calcularPrimos()">Calcular</button>
      </div>

      <div>
        <h3>Cálculos de divisores</h3>

        Número: <input type="text" id="numeroDivisores" />

        <button onclick="calcularDivisores()">Calcular</button>
      </div>

      <div th:if="${txtErr!=null}">
        <p class="alert alert-danger" role="alert" th:text="${txtErr}">error</p>
      </div>

      <div th:if="${resultado!=null}">
        <p class="alert alert-success" role="alert" th:text="${resultado}">
          resultado
        </p>
      </div>
    </main>

    <script>
      function calcularHipotenusa() {
        var cateto1 = document.querySelector("#cateto1").value;
        var cateto2 = document.querySelector("#cateto2").value;

        if (isNaN(cateto1) || isNaN(cateto2) || cateto1 === "" || cateto2 === "") {
          alert("No dejes el campo vacío");
        } else {
          window.location.href =
            "/calculos/hipotenusa/" + cateto1 + "/" + cateto2;
        }
      }

      function calcularPrimos() {
        var numero = document.querySelector("#numeroPrimo").value;

        if (isNaN(numero) || numero === "") {
          alert("No dejes el campo vacío");
        } else {
          window.location.href = "/calculos/primo?num=" + numero;
        }
      }

      function calcularDivisores() {
        var numero = document.querySelector("#numeroDivisores").value;

        if (isNaN(numero) || numero === "") {
          alert("No dejes el campo vacío");
        } else {
          window.location.href = "/calculos/divisores/" + numero;
        }     
      }
    </script>
  </body>
</html>
