<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Paciente - Consulta Médica</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="/css/estilos.css">
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header-wrapper">
          <div>
            <h1>Nuevo paciente</h1>
            <p class="subtitle">Complete los datos para registrar al paciente en la cola</p>
          </div>
          <a th:href="@{/}" href="/" class="btn btn-outline-gray">Volver al listado</a>
        </div>

        <form method="post" action="#" th:action="@{/newPaciente/submit}" th:object="${newPacienteDTO}">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="field-label" for="dni">DNI</label>
              <input type="text" id="dni" class="form-control" th:field="*{dni}"
                     th:classappend="${#fields.hasErrors('dni')} ? 'input-error' : ''" placeholder="Ej: 12345678A" />
              <div class="field-error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}">Error DNI</div>
            </div>

            <div class="form-group">
              <label class="field-label" for="nombre">Nombre completo</label>
              <input type="text" id="nombre" required class="form-control" th:field="*{nombre}"
                     th:classappend="${#fields.hasErrors('nombre')} ? 'input-error' : ''" placeholder="Nombre y apellidos" />
              <div class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error Nombre</div>
            </div>
          </div>

          <div class="form-group">
            <label class="field-label" for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" required id="fechaNacimiento" class="form-control" th:field="*{fechaNacimiento}"
                   th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'input-error' : ''" />
            <span class="form-hint">Seleccione día, mes y año (dd/mm/aaaa)</span>
            <div class="field-error" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}">Error Fecha</div>
          </div>

          <div class="radio-group-container">
            <div class="radio-group-title">Motivo de la visita</div>
            <div class="radio-options">
              <label class="radio-card">
                <input type="radio" value="1" th:field="*{tipoPaciente}" />
                Consulta médica general
              </label>
              <label class="radio-card">
                <input type="radio" value="2" th:field="*{tipoPaciente}" />
                Emisión de recetas
              </label>
              <label class="radio-card">
                <input type="radio" value="3" th:field="*{tipoPaciente}" />
                Revisión periódica
              </label>
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('tipoPaciente')}" th:errors="*{tipoPaciente}">Error Tipo</div>
          </div>

          <div class="form-group">
            <label class="field-label" for="motivoConsulta">Detalle del motivo de consulta (para Consulta)</label>
            <input type="text" id="motivoConsulta" class="form-control" th:field="*{motivoConsulta}"
                   placeholder="Ej: Dolor de cabeza, malestar general..." />
          </div>

          <div class="form-group">
            <label class="field-label" for="medicamentos">Medicamentos prescritos (para Recetas)</label>
            <input type="text" id="medicamentos" class="form-control" th:field="*{medicamentos}"
                   placeholder="Separados por comas: Paracetamol, Ibuprofeno..." />
          </div>

          <div class="form-group">
            <label class="field-label" for="fechaVisitaAnterior">Fecha de visita anterior (para Revisión)</label>
            <input type="date" id="fechaVisitaAnterior" class="form-control" th:field="*{fechaVisitaAnterior}" />
            <span class="form-hint">Seleccione día, mes y año (dd/mm/aaaa)</span>
          </div>

          <div class="actions-bar" style="margin-top: 24px;">
            <input type="submit" value="Registrar Paciente" class="btn btn-primary" />
            <a th:href="@{/}" href="/" class="btn btn-outline-gray">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
